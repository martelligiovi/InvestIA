services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    environment:
      INVESTIA_CONTAINER_NETWORKING: "true"
      HOST: "0.0.0.0"
      PORT: "4317"
      DATABASE_URL: "postgresql://investia:${POSTGRES_PASSWORD:-investia_dev_password}@postgres:5432/investia"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USERNAME: "${NEO4J_USERNAME:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-investia_dev_password}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
    ports:
      - "127.0.0.1:${APP_PORT:-4317}:4317"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      # Readiness is read-only and never dispatches investigation/provider actions.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4317/investigations').then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: investia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-investia_dev_password}
      POSTGRES_DB: investia
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-test-database.sql:/docker-entrypoint-initdb.d/10-create-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investia -d investia"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-investia_dev_password}"
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u \"$${NEO4J_AUTH%%/*}\" -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  neo4j-data:
  neo4j-logs:
